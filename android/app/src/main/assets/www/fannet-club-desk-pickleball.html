<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickleball Club Control Panel</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--ink:#0f172a;--mute:#475162;--line:#e3e8ef;--row:#f7f9fc;--focus:#2563eb;
--green:#12613f;--green-2:#1b7d52;--green-bg:#e3f4ea;--ok-bg:#dcfce7;--ok:#166534;--wa-bg:#fef3c7;--wa:#92400e;--er-bg:#fee2e2;--er:#991b1b;--in-bg:#dbeafe;--in:#1e40af}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit}
nav.main{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:8px 20px;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;margin-right:6px;text-decoration:none;color:var(--ink);flex:none}
.crest{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,#0b3324,#12613f 70%,#2a9a63);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.logo b{font-size:15px;line-height:1.1;display:block;max-width:150px}
.logo small{color:var(--mute);font-size:12px}
.links{display:flex;align-items:center;gap:1px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:thin}
.links a{color:var(--mute);text-decoration:none;padding:7px 8px;font-size:14.5px;border-radius:8px;font-weight:600;white-space:nowrap;position:relative}
.links a:hover{background:var(--row);color:var(--ink)}
.links a[aria-current]{background:var(--green);color:#fff}
.links .n{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:10px;background:#dc2626;color:#fff;font-size:11.5px;margin-left:5px;padding:0 5px}
.acts{display:flex;align-items:center;gap:10px;flex:none;margin-left:8px;padding-left:10px;border-left:1px solid var(--line);font-weight:600;white-space:nowrap}
.acts .role{color:var(--mute);font-weight:500}
main{max-width:1320px;margin:0 auto;padding:20px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
h1{font-size:23px;margin:0}
.sub{color:var(--mute);margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.card>header span{font-weight:500;color:var(--mute);font-size:14px}
.pad{padding:14px 16px}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:2fr 1fr}
@media (max-width:900px){.g3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{color:var(--mute);font-size:13px;font-weight:600}
.kpi .v{font-size:26px;font-weight:800;line-height:1.2}
.kpi .s{font-size:13px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 12px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--row)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-2)}
.btn.sm{padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.wa{background:var(--wa-bg);color:var(--wa)}.er{background:var(--er-bg);color:var(--er)}.in{background:var(--in-bg);color:var(--in)}.mu{background:#eef1f5;color:var(--mute)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);background:var(--row)}
tbody tr:hover{background:var(--row)}
td.num,th.num{text-align:right}
.priv{color:var(--mute);font-size:12.5px;display:flex;gap:6px;align-items:center}
.lock{font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
input[type=text],input[type=search],select,textarea{font:inherit;border:1px solid #c9d0da;border-radius:9px;padding:7px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:90px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.help{background:var(--in-bg);color:#1b3a8f;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.help b{font-weight:700}
.check{display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid #c9d0da;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:13px}
.check.done .bx{background:var(--green);border-color:var(--green)}
.check.done .t{color:var(--mute);text-decoration:line-through}
.check .t{flex:1}
.bar{height:8px;background:#eef1f5;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.li{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .m{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{color:var(--mute);font-size:13.5px}
.av{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.date{width:46px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:3px 0;flex:none}
.date b{display:block;font-size:18px;line-height:1.1}.date small{font-size:11px;color:var(--mute);text-transform:uppercase;font-weight:700}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--green);background:var(--green-bg);border-radius:10px;padding:10px 12px;font:600 15px ui-monospace,Menlo,monospace;color:var(--green)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border:1px solid var(--line);border-radius:10px;padding:10px}
.team h4{margin:0 0 6px}
.team button{display:block;width:100%;text-align:left;border:0;background:var(--row);border-radius:7px;padding:5px 8px;margin-top:4px;cursor:pointer;font-weight:600}
.site{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.site .bar2{display:flex;gap:6px;align-items:center;padding:7px 10px;background:#eef1f5;font:600 12.5px ui-monospace,Menlo,monospace;color:var(--mute)}
.site .bar2 i{width:9px;height:9px;border-radius:50%;background:#cfd5df}
.site .hero{background:linear-gradient(150deg,#0b3324,#12613f 70%,#2a9a63);color:#fff;padding:22px}
.site .hero h2{margin:0;font-size:28px}
.site .nav{display:flex;gap:16px;padding:9px 22px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;color:var(--mute);overflow-x:auto;white-space:nowrap}
.site .sec{padding:12px 22px;border-bottom:1px solid var(--line)}
.site .sec h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.tog{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.tog .s{color:var(--mute);font-size:13.5px}
.sw{appearance:none;width:42px;height:24px;border-radius:12px;background:#cbd2dc;position:relative;cursor:pointer;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--green)}.sw:checked::after{left:21px}
.drawer{position:fixed;inset:0;background:rgba(15,23,42,.4);display:flex;justify-content:flex-end;z-index:20}
.drawer .p{background:#fff;width:min(420px,100%);height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;z-index:30;max-width:calc(100% - 32px)}
.guide{background:#fff8e6;border-bottom:1px solid #f1dfae;padding:8px 20px;font-size:14px;color:#6b4a00}
.guide a{color:#6b4a00;font-weight:700}
@media (max-width:640px){nav.main{padding:8px 12px;flex-wrap:wrap}.links{order:3;flex-basis:100%}.acts .who{display:none}main{padding:14px 12px}.teams{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
</style>
</head>
<body>
<div class="guide">Mock-up · Gamma build · the club control panel set up for pickleball. Same pages as the <a href="fannet-club-desk.html">futsal version</a>; only the sport parts change. All people are made up.</div>
<nav class="main" aria-label="Main">
  <a class="logo" href="#overview"><span class="crest">TD</span><span><b>Thao Dien Pickleball Club</b><small>Control panel · Pickleball</small></span></a>
  <div class="links" id="links"></div>
  <div class="acts"><span class="who">Linh Nguyen <span class="role">(Owner)</span></span></div>
</nav>
<main id="main"></main>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const money=n=>Math.round(+n).toLocaleString('en-US')+' ₫';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600);}
const SEED=()=>({
 members:[
  {n:'Linh Nguyen',role:'Owner',joined:'1 Oct',email:'linh.nguyen@example.com',mob:'+84 900 000 0001',fee:true,came:4},
  {n:'Huy Le',role:'Captain',joined:'1 Oct',email:'huy.le@example.com',mob:'+84 900 000 0002',fee:true,came:4},
  {n:'Mai Tran',role:'Player',joined:'2 Oct',email:'mai.tran@example.com',mob:'+84 900 000 0003',fee:true,came:3},
  {n:'An Pham',role:'Player',joined:'3 Oct',email:'an.pham@example.com',mob:'',fee:true,came:3},
  {n:'Khoa Vo',role:'Player',joined:'3 Oct',email:'',mob:'+84 900 000 0004',fee:false,came:2},
  {n:'Thu Hoang',role:'Player',joined:'4 Oct',email:'thu.hoang@example.com',mob:'',fee:true,came:4},
  {n:'Duc Bui',role:'Player',joined:'4 Oct',email:'duc.bui@example.com',mob:'',fee:false,came:1},
  {n:'Lan Dang',role:'Player',joined:'5 Oct',email:'lan.dang@example.com',mob:'+84 900 000 0005',fee:true,came:2},
  {n:'Minh Do',role:'Player',joined:'5 Oct',email:'minh.do@example.com',mob:'',fee:false,came:2},
  {n:'Quang Ho',role:'Coach',joined:'6 Oct',email:'quang.ho@example.com',mob:'+84 900 000 0006',fee:true,came:4}],
 requests:[{n:'Vy Ngo',how:'Club link, shared in WhatsApp',when:'Today 8:12 am'},{n:'Bao Truong',how:'QR code at training',when:'Yesterday'}],
 invites:[{n:'Ha Phan',to:'ha.phan@example.com',sent:'6 Oct',st:'Opened'},{n:'Tuan Vu',to:'+84 900 000 0007',sent:'6 Oct',st:'Sent'},{n:'Nam Ly',to:'nam.ly@example.com',sent:'2 Oct',st:'Joined'}],
 events:[{id:1,kind:'Open play',t:'Sunday open play',d:'Sun 11 Oct',time:'6:30 am',place:'Thao Dien Courts, courts 1–4',going:14,no:1,repeat:'Every Sunday'},
         {id:2,kind:'Club match',t:'Doubles round robin',d:'Sun 11 Oct',time:'8:30 am',place:'Thao Dien Courts, courts 1–4',going:8,no:0,repeat:''},
         {id:3,kind:'Social',t:'End of month dinner',d:'Sat 31 Oct',time:'7:00 pm',place:'Thao Dien riverside',going:9,no:2,repeat:''}],
 results:[{d:'Sat 3 Oct',a:'Thao Dien Pickleball Club',b:'Saigon Riverside Pickleball',sa:3,sb:2,type:'Recorded',inter:true},
          {d:'Sun 4 Oct',a:'Huy Le & Mai Tran',b:'An Pham & Khoa Vo',games:[[11,7],[9,11],[11,6]]},
          {d:'Sun 4 Oct',a:'Thu Hoang & Lan Dang',b:'Duc Bui & Minh Do',games:[[11,4],[11,9]]},
          {d:'Sun 4 Oct',a:'Huy Le & Mai Tran',b:'Thu Hoang & Lan Dang',games:[[11,8],[7,11],[10,12]]},
          {d:'Sun 27 Sep',a:'Khoa Vo',b:'Duc Bui',games:[[11,5],[11,8]],singles:true}],
 camps:[{n:'Thu Hoang',t:'Entry and travel for the Da Nang Amateur Open',goal:30000000,got:16000000,backers:51,ends:'30 Nov',web:true,why:'Flights, entry and two nights in Da Nang'},
        {n:'Khoa Vo',t:'A new paddle and court shoes',goal:4000000,got:2400000,backers:32,ends:'15 Nov',web:true,why:'Kit for the season'}],
 asked:[], supportOn:true, apps:{player:true,fan:true,captain:false,officials:false,website:true},
 peers:[{n:'Saigon Riverside Pickleball',city:'Ho Chi Minh City',since:'6 Oct',st:'Linked'}],
 peerIn:[{n:'District 7 Social Pickleball',city:'Ho Chi Minh City',when:'Yesterday'}],
 leagueIn:{n:'Saigon Inter-Club Pickleball League',season:'Season 2026–27 · Division 2',starts:'Sat 31 Oct'},
 leagues:[], reg:null, game:null, verifiedBy:'', payVia:'club', passOn:false,
 news:[{t:'Welcome to our new home on Fannet!',d:'5 Oct',web:true,by:'Linh Nguyen'}],
 site:{support:true,photos:true,results:true,sessions:true,news:true,fees:false,kids:false},
 fee:600000, logo:false, helpers:[{n:'Huy Le',can:'Members, sessions and results'},{n:'Quang Ho',can:'Sessions and results'}],
 draft:null, show:{}
});
let S=SEED();try{const v=JSON.parse(localStorage.getItem('fnClubDeskPb.v1')||'null');if(v&&v.members)S=Object.assign(S,v,{draft:null});if(S.apps.website===undefined)S.apps.website=true;}catch(e){}
const save=()=>{try{localStorage.setItem('fnClubDeskPb.v1',JSON.stringify(S))}catch(e){}};
const PAGES=[['overview','Overview'],['members','Members'],['invites','Invites'],['calendar','Calendar'],['results','Results'],['connections','Connections'],['support','Player support'],['website','Website'],['news','News'],['fees','Fees'],['settings','Settings']];
const page=()=>{const h=location.hash.slice(1);return PAGES.some(p=>p[0]===h)?h:'overview'};
const L='thao-dien-pickleball.fannet.club';
const PRIV='<span class="priv"><span class="lock" aria-hidden="true">🔒</span> Only your club sees contact details. They never appear on the website or to other clubs.</span>';
const hd=(h,s,act='')=>`<div class="top"><div><h1>${h}</h1><p class="sub">${s}</p></div><div class="row">${act}</div></div>`;

function overview(){
 const todo=[['Add your logo',S.logo,'settings'],['Invite your players',S.invites.length>0,'invites'],['Add your first session',S.events.length>0,'calendar'],['Post a hello on your website',S.news.length>0,'news'],['Set a season fee (optional)',S.fee>0,'fees']];
 const done=todo.filter(t=>t[1]).length, paid=S.members.filter(m=>m.fee).length;
 return hd('Good morning, Linh','Here is what needs you today. Everything else can wait.',`<a class="btn pri" href="#invites">Invite players</a><a class="btn" href="#calendar">Add a session</a>`)+
 `<div class="kpis">
  <a class="kpi" href="#members" style="text-decoration:none;color:inherit"><div class="l">Members</div><div class="v">${S.members.length}</div><div class="s">${S.invites.filter(i=>i.st!=='Joined').length} invites waiting</div></a>
  <a class="kpi" href="#invites" style="text-decoration:none;color:inherit"><div class="l">Asked to join</div><div class="v" style="color:${S.requests.length?'#b45309':'inherit'}">${S.requests.length}</div><div class="s">${S.requests.length?'Approve or decline':'All done'}</div></a>
  <a class="kpi" href="#calendar" style="text-decoration:none;color:inherit"><div class="l">Next session</div><div class="v" style="font-size:20px">${S.events[0]?esc(S.events[0].d):'None yet'}</div><div class="s">${S.events[0]?`${S.events[0].going} coming`:''}</div></a>
  <a class="kpi" href="#fees" style="text-decoration:none;color:inherit"><div class="l">Season fee paid</div><div class="v">${paid} of ${S.members.length}</div><div class="bar" style="margin-top:6px"><i style="width:${paid/S.members.length*100}%"></i></div></a>
 </div>
 <div class="grid g3"><div class="grid">
  ${S.requests.length?`<section class="card"><header>Asked to join <span>ID checked by Fannet</span></header>${reqList()}</section>`:''}
  <section class="card"><header>Coming up <a class="btn sm" href="#calendar">All sessions</a></header>${S.events.slice(0,3).map(evLi).join('')}</section>
  <section class="card"><header>Latest result <a class="btn sm" href="#results">All results</a></header>${S.results[0]?resLi(S.results[0]):'<div class="pad">No games yet.</div>'}</section>
 </div><div class="grid" style="align-content:start">
  <section class="card"><header>Getting started <span>${done} of ${todo.length}</span></header><div class="pad" style="padding-bottom:4px"><div class="bar"><i style="width:${done/todo.length*100}%"></i></div></div>
   ${todo.map(t=>`<div class="check ${t[1]?'done':''}"><span class="bx">${t[1]?'✓':''}</span><span class="t">${t[0]}</span>${t[1]?'':`<a class="btn sm" href="#${t[2]}">Do it</a>`}</div>`).join('')}</section>
  <section class="card"><header>Your Fannet apps <a class="btn sm" href="#settings">Change</a></header><div class="pad" style="font-size:14px">${APPS.filter(a=>a[4]||S.apps[a[0]]).map(a=>`<span class="chip ok" style="margin:0 4px 4px 0">${a[1]}</span>`).join('')}${APPS.filter(a=>!a[4]&&!S.apps[a[0]]).map(a=>`<span class="chip mu" style="margin:0 4px 4px 0">${a[1]}: off</span>`).join('')}</div></section>
  ${S.supportOn?'':'<!--'}<section class="card"><header>Player support <a class="btn sm" href="#support">Open</a></header>${S.camps.map(c=>`<div class="li"><span class="av">${ini(c.n)}</span><div class="m"><div class="t">${esc(c.n)}</div><div class="s">${money(c.got)} of ${money(c.goal)} · ${c.backers} backers</div><div class="bar" style="margin-top:4px"><i style="width:${Math.min(100,c.got/c.goal*100)}%"></i></div></div></div>`).join('')||'<div class="pad sub">No campaigns yet.</div>'}</section>${S.supportOn?'':'-->'}
  <section class="card"><header>Your website ${S.apps.website?vchip():'<span class="chip mu">Off</span>'}</header><div class="pad">${S.apps.website?'':'<p class="sub" style="font-size:14px;margin-top:0">Turned off. The club is private online.</p>'}<div style="font-family:ui-monospace,Menlo,monospace;font-size:14px">${L}</div><p class="sub" style="font-size:14px">Updates by itself from this panel. Verified once your association or Fannet confirms the club.</p><a class="btn" href="#website">Manage website</a></div></section>
 </div></div>`;
}
const reqList=()=>S.requests.map(r=>`<div class="li"><span class="av">${ini(r.n)}</span><div class="m"><div class="t">${esc(r.n)}</div><div class="s">${esc(r.how)} · ${esc(r.when)}</div></div><button class="btn sm pri" data-a="approve" data-v="${esc(r.n)}">Approve</button><button class="btn sm" data-a="decline" data-v="${esc(r.n)}">Decline</button></div>`).join('')||'<div class="pad sub">Nobody is waiting.</div>';
const dd=d=>{const p=d.split(' ');return `<span class="date"><small>${p[0]}</small><b>${p[1]}</b><small>${p[2]}</small></span>`};
const vchip=()=>S.verifiedBy?'<span class="chip ok">✓ Verified</span>':'<span class="chip wa">Not yet verified</span>';
const inCount=()=>S.peerIn.length+(S.leagueIn?1:0);
const evLi=e=>`<div class="li">${dd(e.d)}<div class="m"><div class="t">${esc(e.t)}</div><div class="s">${esc(e.time)} · ${esc(e.place)}${e.repeat?' · '+e.repeat:''}</div></div><span class="chip ${e.kind==='Recorded'?'ok':e.kind==='Club match'||e.kind==='Friendly'?'in':e.kind==='Social'?'wa':e.kind==='League'?'er':'ok'}">${e.kind}</span><span class="chip mu">${e.going} coming</span></div>`;
const scLine=r=>r.inter?'3 matches to 2':(r.games||[]).map(g=>g.join('–')).join(', ');
const won=r=>{if(r.inter)return r.sa>r.sb?'a':'b';const w=(r.games||[]).filter(g=>g[0]>g[1]).length;return w*2>(r.games||[]).length?'a':'b'};
const GT={Club:['mu','Club match'],Friendly:['in','Friendly'],Recorded:['ok','Recorded'],League:['er','League']};
const gchip=r=>{const g=GT[r.type||'Club'];return `<span class="chip ${g[0]}">${g[1]}</span>`};
const resLi=r=>`<div class="li"><div class="m"><div class="t">${won(r)==='a'?`<b>${esc(r.a)}</b> beat ${esc(r.b)}`:`<b>${esc(r.b)}</b> beat ${esc(r.a)}`}</div><div class="s">${r.d} · ${scLine(r)}${r.singles?' · singles':''}</div></div>${gchip(r)}</div>`;

function members(){
 const q=(S.q||'').toLowerCase(), list=S.members.filter(m=>!q||m.n.toLowerCase().includes(q)||m.role.toLowerCase().includes(q));

function calendar(){
 const d=S.draft;
 return hd('Calendar','Open play, round robins and socials. Members see them in the app and say if they are coming.',`<button class="btn pri" data-a="newev" data-v="Open play">New open play</button><button class="btn" data-a="newmatch">New round robin</button><button class="btn" data-a="newev" data-v="Social">New social</button>`)+
 (d&&d.type==='ev'?`<section class="card" style="margin-bottom:14px"><header>New ${d.kind.toLowerCase()}</header><div class="pad grid g2" style="gap:12px">
   <label class="f">Name<input type="text" id="ev-t" value="${d.kind==='Social'?'Season launch drinks':'Thursday open play'}"></label>
   <label class="f">Day<select id="ev-d"><option>Thu 15 Oct</option><option>Sun 18 Oct</option><option>Sat 24 Oct</option></select></label>
   <label class="f">Time<input type="text" id="ev-time" value="${d.kind==='Social'?'6:00 pm':'5:30 pm'}"></label>
   <label class="f">Place<input type="text" id="ev-p" value="Thao Dien Courts, courts 1–4"></label>
   <label class="f">Repeat<select id="ev-r"><option value="">Just once</option><option>Every week</option></select></label>
   <div class="row" style="align-self:end"><button class="btn pri" data-a="saveev">Add and tell members</button><button class="btn" data-a="cancel">Cancel</button></div></div></section>`:'')+
 (d&&d.type==='match'?matchBox(d):'')+
 `<section class="card"><header>Coming up <span>${S.events.length}</span></header>${S.events.map(evLi).join('')||'<div class="pad sub">Nothing yet.</div>'}</section>
 <div class="help" style="margin-top:14px"><b>Playing other clubs?</b> Link with a club or join a league under <a href="#connections">Connections</a>. Friendlies and league fixtures then show here.</div>`;
}
const rr=n=>{const t=[...Array(n).keys()];if(n%2)t.push(-1);const R=[];for(let r=0;r<t.length-1;r++){const P=[];for(let i=0;i<t.length/2;i++){const a=t[i],b=t[t.length-1-i];if(a>=0&&b>=0)P.push([a,b])}R.push(P);t.splice(1,0,t.pop())}return R};
function matchBox(d){
 const pool=S.members.map(m=>m.n), ok=d.picked.length>=4&&d.picked.length%2===0;
 if(d.stage===0) return `<section class="card" style="margin-bottom:14px"><header>New doubles round robin: who is playing? <span>${d.picked.length} picked</span></header><div class="pad">
  <div class="row">${pool.map(n=>`<label class="chip ${d.picked.includes(n)?'ok':'mu'}" style="cursor:pointer;font-size:14px;padding:5px 11px"><input type="checkbox" data-a="pick" data-v="${esc(n)}" ${d.picked.includes(n)?'checked':''} style="margin:0 6px 0 0">${esc(n)}</label>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="btn pri" data-a="split" ${ok?'':'disabled'}>Make doubles pairs</button><button class="btn" data-a="cancel">Cancel</button><span class="sub" style="font-size:13.5px">${ok?'Ticked: members who said they\'re coming on Sun 11 Oct.':'Doubles needs an even number of players, at least 4.'}</span></div></div></section>`;
 const R=rr(d.P.length), courts=Math.min(4,Math.floor(d.P.length/2));
 return `<section class="card" style="margin-bottom:14px"><header>New doubles round robin <span>${d.P.length} pairs · ${R.length} rounds · ${courts} court${courts>1?'s':''}</span></header><div class="pad">
  <div class="row">${d.P.map((p,i)=>`<span class="chip in" style="font-size:14px;padding:5px 11px">Pair ${i+1}: ${esc(p[0])} & ${esc(p[1])}</span>`).join('')}</div>
  <div class="wrap" style="margin-top:12px"><table><thead><tr><th>Round</th>${[...Array(courts).keys()].map(c=>`<th>Court ${c+1}</th>`).join('')}</tr></thead><tbody>
   ${R.map((P,r)=>`<tr><td>${r+1}</td>${[...Array(courts).keys()].map(c=>`<td>${P[c]?`Pair ${P[c][0]+1} v Pair ${P[c][1]+1}`:'<span class="sub">Rest</span>'}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>
  <p class="sub" style="font-size:13.5px">Each game to 11, win by 2. Every pair plays every other pair once.</p>
  <div class="row"><button class="btn pri" data-a="savematch">Add round robin and tell players</button><button class="btn" data-a="split">New pairs</button><button class="btn" data-a="cancel">Cancel</button></div></div></section>`;
}
const rec=n=>{let w=0,l=0,pf=0,pa=0;S.results.forEach(r=>{if(r.inter)return;const side=r.a.split(' & ').includes(n)?'a':r.b.split(' & ').includes(n)?'b':null;if(!side)return;won(r)===side?w++:l++;(r.games||[]).forEach(g=>{pf+=side==='a'?g[0]:g[1];pa+=side==='a'?g[1]:g[0]})});return{w,l,d:pf-pa}};
function results(){
 const names=[...new Set(S.results.filter(r=>!r.inter).flatMap(r=>[...r.a.split(' & '),...r.b.split(' & ')]))];
 const ladder=names.map(n=>[n,rec(n)]).sort((a,b)=>b[1].w-a[1].w||b[1].d-a[1].d).slice(0,6);
 return hd('Results','Matches are best of 3 games, each to 11, win by 2. Recorded matches go into players\' records; only league matches count in a league.',`<button class="btn pri" data-a="toast" data-m="Pick a match from the Calendar to enter its games">Enter a score</button>`)+
 `<div class="grid g3"><section class="card"><header>Matches <span>${S.results.length}</span></header><div class="wrap"><table><thead><tr><th>Date</th><th>Winner</th><th>Beat</th><th>Games</th><th>Type</th><th></th></tr></thead><tbody>
  ${S.results.map(r=>{const w=won(r)==='a';return `<tr><td>${r.d}</td><td style="white-space:normal"><b>${esc(w?r.a:r.b)}</b></td><td style="white-space:normal">${esc(w?r.b:r.a)}</td><td>${scLine(r)}${r.singles?' <span class="sub">singles</span>':''}</td><td>${gchip(r)}${r.type==='Recorded'?'<div class="sub" style="font-size:12.5px">Confirmed by both clubs</div>':''}</td><td><button class="btn sm" data-a="toast" data-m="Opens the games to correct them">Edit</button></td></tr>`}).join('')}
 </tbody></table></div></section>
 <section class="card" style="align-self:start"><header>Club ladder <span>Club matches this season</span></header>${ladder.map(([n,x],i)=>`<div class="li"><b style="width:18px">${i+1}</b><span class="av" style="width:28px;height:28px;font-size:11px">${ini(n)}</span><div class="m"><div class="t">${esc(n)}</div><div class="s">${x.d>=0?'+':''}${x.d} points</div></div><b>${x.w}–${x.l}</b></div>`).join('')}</section></div>`;
}
const supSwitch=()=>`<label class="tog" style="border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:14px"><span><b>Player support for this club is ${S.supportOn?'on':'off'}</b><br><span class="s">${S.supportOn?'Players can link campaigns to the club, and you can show them on the website and in News.':'Players can\'t link campaigns to the club. Nothing about funding shows on the club website, in club News or in this panel.'}</span></span><input type="checkbox" class="sw" id="sup-on" ${S.supportOn?'checked':''} aria-label="Player support for this club"></label>`;

   ${S.peerIn.map(p=>`<div class="li"><span class="av" style="background:#1e40af">${ini(p.n)}</span><div class="m"><div class="t">${esc(p.n)} wants to link clubs</div><div class="s">${esc(p.city)} · ${esc(p.when)} · to play each other</div></div><button class="btn sm pri" data-a="peeracc" data-v="${esc(p.n)}">Accept</button><button class="btn sm" data-a="peerdec" data-v="${esc(p.n)}">Decline</button></div>`).join('')}
 </section>`:''}
 <div class="grid g2">
  <section class="card"><header>Leagues and associations <span>Official games</span></header>

   <div class="pad" style="border-top:1px solid var(--line)"><b>Ask to join</b><div class="li" style="padding:8px 0;border:0"><div class="m"><div class="t">Ho Chi Minh City Pickleball Association</div><div class="s">City association · confirms clubs and runs city tournaments</div></div><button class="btn sm" data-a="toast" data-m="Request sent. The association checks the club and replies in Connections">Ask to join</button></div>

function support(){

 else if(a==='gamecancel'){S.game=null;}
 else if(a==='gamesend'){const g=S.game,home=$('#g-w').value.startsWith('Home');S.events.push({id:Date.now(),kind:g.type,t:`${g.type==='Recorded'?'Recorded game':'Friendly'} v ${g.with}`,d:$('#g-d').value,time:'10:00 am',place:home?'Thao Dien Courts, courts 1–4':`${g.with} home ground`,going:0,no:0,repeat:''});toast(`${g.type} game sent to ${g.with}. It's in both calendars once they accept`);S.game=null;}
 else if(a==='suggest'){const n=$('#sg-p').value;if(!n)return;S.asked.push(n);toast(`Suggestion sent to ${n}`);}
 else if(a==='logo'){S.logo=true;toast('Logo added to the app and website');}
 else if(a==='reset'){S=SEED();toast('Demo data reset');}
 else return;
 render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.open){S.open=null;render();}});
render();
</script>
</body>
</html>
