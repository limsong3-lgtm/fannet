plugins {
    id "com.android.application"
}

android {
    namespace "net.fannet.gamma"
    compileSdk 34

    defaultConfig {
        applicationId "net.fannet.gamma"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "0.5-gamma"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
