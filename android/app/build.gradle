plugins {
    id "com.android.application"
}

android {
    namespace "net.fannet.gamma"
    compileSdk 34

    defaultConfig {
        applicationId "net.fannet.gamma"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "0.9-live"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

